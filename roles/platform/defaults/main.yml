---
# Defaults for AWXPlatform umbrella role
admin_user: admin
admin_password_secret: ''
# Hide Secret material in operator logs. Set false on the CR to debug.
no_log: true
open_source_defaults: true

controller:
  create: true
  name: ''
  image: ghcr.io/ansible/awx
  image_version: devel

gateway:
  create: true
  name: ''
  image: ghcr.io/flippyboy/awx/jewel-with-ui
  image_version: "0.1.2"
  ui_mode: baked
  ui_image: ''
  # TLS (cert-manager) — passed through to AWXGateway
  tls_secret: ''
  create_certificate: true
  create_tls_issuer: true
  tls_issuer: ''
  tls_issuer_kind: Issuer
  tls_dns_names: []
  # Controller Service port (ClusterIP 80 → container 8052); Jewel/Envoy must use 80
  controller_service_port: "80"
  controller_service_https: false

ingress:
  type: none
  ingress_class_name: ''
  hosts: []
  tls_secret: ''

bootstrap:
  enabled: true

# External shared services (required for platform children)
postgres_configuration_secret: ''
# Optional external Redis for gateway (Secret keys: url OR host+port)
redis_configuration_secret: ''
set_self_labels: true
deployment_type: awx
