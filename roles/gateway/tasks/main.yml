---
# AWXGateway — deploy Jewel + Redis + optional Envoy (Phase 2)

- name: Set meta facts
  set_fact:
    __admin_password_secret: >-
      {{ admin_password_secret
         if admin_password_secret | default('') | length
         else ansible_operator_meta.name ~ '-admin-password' }}
    __secret_key_secret: >-
      {{ secret_key_secret
         if secret_key_secret | default('') | length
         else ansible_operator_meta.name ~ '-secret-key' }}

- name: Label AWXGateway
  k8s:
    state: present
    definition:
      apiVersion: '{{ api_version | default("awx.ansible.com/v1beta1") }}'
      kind: '{{ kind | default("AWXGateway") }}'
      name: '{{ ansible_operator_meta.name }}'
      namespace: '{{ ansible_operator_meta.namespace }}'
      metadata:
        labels:
          app.kubernetes.io/managed-by: awx-operator
          app.kubernetes.io/component: gateway
          app.kubernetes.io/name: '{{ ansible_operator_meta.name }}'
  when: set_self_labels | default(true) | bool
  ignore_errors: true

- name: Load or generate admin password secret
  block:
    - name: Check admin password secret
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ __admin_password_secret }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: admin_secret_info

    - name: Set admin password from existing secret
      set_fact:
        __admin_password: "{{ admin_secret_info.resources[0].data.password | b64decode }}"
      when: admin_secret_info.resources | default([]) | length > 0

    - name: Generate admin password
      set_fact:
        __admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      when: admin_secret_info.resources | default([]) | length == 0

    - name: Apply admin password secret
      k8s:
        state: present
        definition: "{{ lookup('template', 'secrets/admin_password.yaml.j2') | from_yaml }}"

- name: Load or generate Django secret key
  block:
    - name: Check secret key secret
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ __secret_key_secret }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: sk_info

    - name: Set secret key from existing
      set_fact:
        __secret_key: "{{ sk_info.resources[0].data.SECRET_KEY | b64decode }}"
      when: sk_info.resources | default([]) | length > 0

    - name: Generate secret key
      set_fact:
        __secret_key: "{{ lookup('password', '/dev/null length=50 chars=ascii_letters,digits') }}"
      when: sk_info.resources | default([]) | length == 0

    - name: Apply secret key secret
      k8s:
        state: present
        definition: "{{ lookup('template', 'secrets/secret_key.yaml.j2') | from_yaml }}"

- name: Resolve postgres connection
  block:
    - name: Fail if postgres_configuration_secret missing
      fail:
        msg: >-
          AWXGateway requires postgres_configuration_secret with keys
          host, port, database, username, password (same shape as AWX postgres secret).
      when: postgres_configuration_secret | default('') | length == 0

    - name: Read postgres configuration secret
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ postgres_configuration_secret }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: pg_secret

    - name: Parse postgres secret
      set_fact:
        __pg_host: "{{ pg_secret.resources[0].data.host | b64decode }}"
        __pg_port: "{{ pg_secret.resources[0].data.port | default('NTQzMg==') | b64decode }}"
        __pg_username: "{{ pg_secret.resources[0].data.username | b64decode }}"
        __pg_password: "{{ pg_secret.resources[0].data.password | b64decode }}"
        __pg_connect_database: "{{ (pg_secret.resources[0].data.database | default('') | b64decode) if (pg_secret.resources[0].data.database is defined) else 'postgres' }}"

- name: Ensure gateway database exists
  k8s:
    state: present
    definition: "{{ lookup('template', 'jobs/init_database.yaml.j2') | from_yaml }}"
    apply: true
    force: false
  # Job names are immutable; delete completed job if we need re-run
  register: init_db_job
  ignore_errors: true

- name: Wait for init-db job
  k8s_info:
    api_version: batch/v1
    kind: Job
    name: '{{ ansible_operator_meta.name }}-init-db'
    namespace: '{{ ansible_operator_meta.namespace }}'
  register: init_job
  until: >-
    init_job.resources | default([]) | length > 0 and (
      (init_job.resources[0].status.succeeded | default(0) | int) >= 1
      or (init_job.resources[0].status.failed | default(0) | int) >= 1
    )
  retries: 60
  delay: 5
  ignore_errors: true

- name: Resolve Redis (managed vs external)
  block:
    - name: Read redis configuration secret
      when: redis_configuration_secret | default('') | length > 0
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ redis_configuration_secret }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: redis_secret_info

    - name: Set Redis URL from secret
      when:
        - redis_configuration_secret | default('') | length > 0
        - redis_secret_info.resources | default([]) | length > 0
      set_fact:
        __redis_url: >-
          {{
            (redis_secret_info.resources[0].data.url | b64decode)
            if (redis_secret_info.resources[0].data.url is defined)
            else (
              'redis://'
              ~ (redis_secret_info.resources[0].data.host | b64decode)
              ~ ':'
              ~ (redis_secret_info.resources[0].data.port | default('NjM3OQ==') | b64decode)
              ~ '/0'
            )
          }}
        __redis_managed: false

    - name: Set Redis URL from redis_url field
      when:
        - redis_url | default('') | length > 0
        - __redis_url is not defined
      set_fact:
        __redis_url: '{{ redis_url }}'
        __redis_managed: false

    - name: Default to managed Redis Service
      when: __redis_url is not defined
      set_fact:
        __redis_url: 'redis://{{ ansible_operator_meta.name }}-redis:6379/0'
        __redis_managed: '{{ redis_managed | default(true) | bool }}'

    - name: Derive REDIS_HOSTS host:port from URL
      set_fact:
        __redis_hosts: >-
          {{
            (__redis_url | urlsplit('hostname'))
            ~ ':'
            ~ ((__redis_url | urlsplit('port')) | default(6379, true) | string)
          }}

- name: Apply settings ConfigMap
  k8s:
    state: present
    definition: "{{ lookup('template', 'configmaps/settings.yaml.j2') | from_yaml }}"
    apply: true

# ---------------------------------------------------------------------------
# TLS: cert-manager Certificate (shared Jewel + Envoy) or legacy init gen-tls
# ---------------------------------------------------------------------------
- name: Resolve gateway TLS settings
  set_fact:
    __tls_secret: >-
      {{ tls_secret
         if (tls_secret | default('') | length)
         else (ansible_operator_meta.name ~ '-tls') }}
    __tls_issuer: >-
      {{ tls_issuer
         if (tls_issuer | default('') | length)
         else (ansible_operator_meta.name ~ '-selfsigned') }}
    __tls_ca_configmap: >-
      {{ tls_ca_configmap
         if (tls_ca_configmap | default('') | length)
         else (ansible_operator_meta.name ~ '-tls-ca') }}
    __create_certificate: '{{ create_certificate | default(true) | bool }}'
    __create_tls_issuer: '{{ create_tls_issuer | default(true) | bool }}'

- name: Default Certificate DNS SANs
  when: tls_dns_names | default([]) | length == 0
  set_fact:
    __tls_dns_names:
      - '{{ ansible_operator_meta.name }}'
      - '{{ ansible_operator_meta.name }}.{{ ansible_operator_meta.namespace }}.svc'
      - '{{ ansible_operator_meta.name }}.{{ ansible_operator_meta.namespace }}.svc.cluster.local'
      - '{{ ansible_operator_meta.name }}-envoy'
      - '{{ ansible_operator_meta.name }}-envoy.{{ ansible_operator_meta.namespace }}.svc'
      - '{{ ansible_operator_meta.name }}-envoy.{{ ansible_operator_meta.namespace }}.svc.cluster.local'

- name: Use provided Certificate DNS SANs
  when: tls_dns_names | default([]) | length > 0
  set_fact:
    __tls_dns_names: '{{ tls_dns_names }}'

- name: Issue TLS via cert-manager
  when: __create_certificate | bool
  block:
    - name: Create self-signed Issuer
      when:
        - __create_tls_issuer | bool
        - (tls_issuer_kind | default('Issuer')) == 'Issuer'
      k8s:
        state: present
        definition: "{{ lookup('template', 'certificates/issuer.yaml.j2') | from_yaml }}"
        apply: true

    - name: Create Certificate (Jewel + Envoy shared Secret)
      k8s:
        state: present
        definition: "{{ lookup('template', 'certificates/certificate.yaml.j2') | from_yaml }}"
        apply: true

    - name: Wait for TLS Secret from cert-manager
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ __tls_secret }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: tls_secret_info
      until: >-
        tls_secret_info.resources | default([]) | length > 0
        and ('tls.crt' in (tls_secret_info.resources[0].data | default({})))
        and ('tls.key' in (tls_secret_info.resources[0].data | default({})))
      retries: '{{ tls_secret_wait_retries | default(60) | int }}'
      delay: '{{ tls_secret_wait_delay | default(5) | int }}'

    - name: Set TLS secret mode
      set_fact:
        __use_tls_secret: true

    - name: Extract CA PEM for BackendTLSPolicy ConfigMap
      when: create_tls_ca_configmap | default(true) | bool
      set_fact:
        __tls_ca_pem: >-
          {{
            (
              tls_secret_info.resources[0].data['ca.crt']
              if ('ca.crt' in tls_secret_info.resources[0].data)
              else tls_secret_info.resources[0].data['tls.crt']
            ) | b64decode
          }}

    - name: Publish CA ConfigMap (Gateway API BackendTLSPolicy)
      when:
        - create_tls_ca_configmap | default(true) | bool
        - __tls_ca_pem | default('') | length > 0
      k8s:
        state: present
        definition: "{{ lookup('template', 'certificates/ca-configmap.yaml.j2') | from_yaml }}"
        apply: true
  rescue:
    - name: Fail clearly when cert-manager path requested but unavailable
      fail:
        msg: >-
          AWXGateway create_certificate=true but cert-manager Certificate/Secret
          '{{ __tls_secret }}' was not ready. Install cert-manager, ensure Issuer
          '{{ __tls_issuer }}' ({{ tls_issuer_kind | default('Issuer') }}) exists,
          or set create_certificate=false to use init-generated self-signed TLS,
          or set tls_secret to an existing kubernetes.tls Secret.

- name: Use provided tls_secret without Certificate create
  when:
    - not (__create_certificate | bool)
    - tls_secret | default('') | length > 0
  block:
    - name: Check provided TLS Secret
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ __tls_secret }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: provided_tls_secret
      failed_when: provided_tls_secret.resources | default([]) | length == 0

    - name: Set TLS secret mode from provided secret
      set_fact:
        __use_tls_secret: true
        __tls_ca_pem: >-
          {{
            (
              provided_tls_secret.resources[0].data['ca.crt']
              if ('ca.crt' in (provided_tls_secret.resources[0].data | default({})))
              else provided_tls_secret.resources[0].data['tls.crt']
            ) | b64decode
          }}

    - name: Publish CA ConfigMap from provided secret
      when:
        - create_tls_ca_configmap | default(true) | bool
        - __tls_ca_pem | default('') | length > 0
      k8s:
        state: present
        definition: "{{ lookup('template', 'certificates/ca-configmap.yaml.j2') | from_yaml }}"
        apply: true

- name: Legacy init-generated TLS when no Secret path
  when:
    - not (__create_certificate | bool)
    - tls_secret | default('') | length == 0
  set_fact:
    __use_tls_secret: false

- name: Apply managed Redis
  when: __redis_managed | default(true) | bool
  k8s:
    state: present
    definition: "{{ item }}"
    apply: true
  loop: "{{ lookup('template', 'deployments/redis.yaml.j2') | from_yaml_all | list }}"

- name: Apply Jewel deployment and service
  k8s:
    state: present
    definition: "{{ item }}"
    apply: true
  loop: "{{ lookup('template', 'deployments/jewel.yaml.j2') | from_yaml_all | list }}"

- name: Wait for Jewel deployment
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: '{{ ansible_operator_meta.name }}'
    namespace: '{{ ansible_operator_meta.namespace }}'
  register: jewel_dep
  until: >-
    jewel_dep.resources | default([]) | length > 0
    and (jewel_dep.resources[0].status.readyReplicas | default(0) | int) >= 1
  retries: 90
  delay: 10

- name: Apply Envoy
  when: envoy_enabled | default(true) | bool
  k8s:
    state: present
    definition: "{{ item }}"
    apply: true
  loop: "{{ lookup('template', 'deployments/envoy.yaml.j2') | from_yaml_all | list }}"

- name: Apply edge Ingress → Envoy (Phase 3)
  when:
    - ingress_type | default('none') | lower == 'ingress'
    - ingress_hosts | default([]) | length > 0
  k8s:
    state: present
    definition: "{{ lookup('template', 'ingress/ingress.yaml.j2') | from_yaml }}"
    apply: true

- name: Apply service registration Job (controller API route always registered)
  when: run_register_job | default(true) | bool
  block:
    - name: Remove previous registration Job if present
      k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        name: '{{ ansible_operator_meta.name }}-register'
        namespace: '{{ ansible_operator_meta.namespace }}'
      ignore_errors: true

    - name: Apply trust register ConfigMap and Job
      k8s:
        state: present
        definition: "{{ item }}"
        apply: true
      loop: "{{ lookup('template', 'jobs/trust_register.yaml.j2') | from_yaml_all | list }}"
    - name: Wait for registration Job
      k8s_info:
        api_version: batch/v1
        kind: Job
        name: '{{ ansible_operator_meta.name }}-register'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: reg_job
      until: >-
        reg_job.resources | default([]) | length > 0 and (
          (reg_job.resources[0].status.succeeded | default(0) | int) >= 1
          or (reg_job.resources[0].status.failed | default(0) | int) >= 1
        )
      retries: 60
      delay: 5
      ignore_errors: true

- name: Generate controller service secret (JWT shared key)
  when:
    - generate_controller_service_secret | default(true) | bool
    - run_register_job | default(true) | bool
  block:
    - name: Check if controller service secret already exists
      k8s_info:
        api_version: v1
        kind: Secret
        name: '{{ ansible_operator_meta.name }}-controller-service-secret'
        namespace: '{{ ansible_operator_meta.namespace }}'
      register: ctrl_svc_secret_info

    # Operator image has no kubectl — use kubernetes.core.k8s_exec + k8s modules.
    - name: Generate secret via jewel Django API (idempotent if Secret present)
      when: ctrl_svc_secret_info.resources | default([]) | length == 0
      block:
        - name: Find Jewel pod
          k8s_info:
            api_version: v1
            kind: Pod
            namespace: '{{ ansible_operator_meta.namespace }}'
            label_selectors:
              - 'app.kubernetes.io/name={{ ansible_operator_meta.name }}'
          register: jewel_pods

        - name: Fail when Jewel pod missing
          fail:
            msg: 'No Jewel pod found to generate controller service secret'
          when: jewel_pods.resources | default([]) | length == 0

        - name: Exec generate_key on controller ServiceAPIRoute
          kubernetes.core.k8s_exec:
            namespace: '{{ ansible_operator_meta.namespace }}'
            pod: '{{ jewel_pods.resources[0].metadata.name }}'
            container: jewel
            command:
              - python3
              - -c
              - |
                import os, sys
                os.environ.setdefault("DJANGO_SETTINGS_MODULE", "aap_gateway_api.settings")
                import django
                django.setup()
                from aap_gateway_api.models import ServiceAPIRoute
                route = ServiceAPIRoute.objects.filter(api_slug="controller").first()
                if route is None:
                    sys.stderr.write("no ServiceAPIRoute api_slug=controller\n")
                    sys.exit(2)
                key = route.service_cluster.generate_key()
                # stdout must be only the secret (colorama/etc. go to stderr)
                sys.stdout.write(key.secret)
                sys.stdout.write("\n")
          register: gen_key_exec

        - name: Parse generated secret
          set_fact:
            __generated_controller_secret: '{{ gen_key_exec.stdout | default("") | trim }}'

        - name: Fail if secret empty or polluted
          fail:
            msg: >-
              Failed to generate controller service secret from Jewel:
              stdout={{ gen_key_exec.stdout | default('') | truncate(200) }}
              stderr={{ gen_key_exec.stderr | default('') | truncate(400) }}
          when: >-
            (__generated_controller_secret | default('') | length) < 20
            or ('colorama' in (__generated_controller_secret | lower))
            or ('traceback' in (__generated_controller_secret | lower))
            or ('error' == (__generated_controller_secret | lower | truncate(5, True, '')))

        - name: Create controller service secret
          k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: '{{ ansible_operator_meta.name }}-controller-service-secret'
                namespace: '{{ ansible_operator_meta.namespace }}'
                labels:
                  app.kubernetes.io/name: '{{ ansible_operator_meta.name }}'
                  app.kubernetes.io/managed-by: awx-operator
                  app.kubernetes.io/component: gateway-trust
              type: Opaque
              stringData:
                secret: '{{ __generated_controller_secret }}'

    - name: Record controller service secret name
      set_fact:
        __controller_service_secret: '{{ ansible_operator_meta.name }}-controller-service-secret'

- name: Patch AWXGateway status
  k8s:
    state: present
    definition:
      apiVersion: '{{ api_version | default("awx.ansible.com/v1beta1") }}'
      kind: AWXGateway
      metadata:
        name: '{{ ansible_operator_meta.name }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
      status:
        URL: 'https://{{ ansible_operator_meta.name }}.{{ ansible_operator_meta.namespace }}.svc:8000'
        controllerServiceSecret: '{{ ansible_operator_meta.name }}-controller-service-secret'
        tlsSecret: '{{ __tls_secret | default("") }}'
        tlsMode: '{{ "secret" if (__use_tls_secret | default(false)) else "init-generated" }}'
        tlsCAConfigMap: '{{ __tls_ca_configmap | default("") if (__use_tls_secret | default(false)) else "" }}'
        conditions:
          - type: Ready
            status: "True"
            reason: Deployed
            message: >-
              Jewel gateway ready; controller service secret available;
              tls={{ "secret" if (__use_tls_secret | default(false)) else "init-generated" }}
  ignore_errors: true
