---
# Defaults for AWXGateway role (Jewel + optional Envoy)

image: ghcr.io/ansible/jewel
image_version: latest
image_pull_policy: IfNotPresent
image_pull_secrets: []

replicas: 1
admin_user: admin
admin_password_secret: ''
secret_key_secret: ''
postgres_configuration_secret: ''
database_name: gateway

# Managed Redis Deployment (default). Skip when redis_url or redis_configuration_secret set.
redis_image: docker.io/redis
redis_image_version: "7"
# External Redis: redis://host:6379/0  OR secret with key url (or host+port)
redis_url: ''
redis_configuration_secret: ''
redis_managed: true

# ---------------------------------------------------------------------------
# TLS for Jewel HTTPS + Envoy listener (shared Secret)
# ---------------------------------------------------------------------------
# Prefer cert-manager. When create_certificate is true (default), the gateway
# role applies an Issuer (optional) + Certificate and mounts the resulting
# kubernetes.tls Secret into BOTH Jewel and Envoy.
#
# Set create_certificate=false and leave tls_secret empty to keep the legacy
# initContainer self-signed emptyDir path (no cert-manager required).
tls_secret: ''
create_certificate: true
# When true and create_certificate, create a namespaced self-signed Issuer
create_tls_issuer: true
tls_issuer: ''                 # default: {name}-selfsigned
tls_issuer_kind: Issuer        # Issuer | ClusterIssuer
tls_issuer_group: cert-manager.io
# DNS SANs for the Certificate (also used as commonName first entry)
tls_dns_names: []
# Certificate duration / renew (cert-manager format)
tls_duration: 2160h    # 90d
tls_renew_before: 360h # 15d
# Wait for Secret keys after Certificate is applied
tls_secret_wait_retries: 60
tls_secret_wait_delay: 5
# Optional: publish CA ConfigMap for Gateway API BackendTLSPolicy
create_tls_ca_configmap: true
tls_ca_configmap: ''           # default: {name}-tls-ca

ui_mode: baked
ui_image: ''

envoy_enabled: true
envoy_image: mirror.gcr.io/envoyproxy/envoy
envoy_image_version: v1.36.6

# Phase 3 — edge Ingress (targets Envoy, not Jewel/Controller)
ingress_type: none   # none | ingress | route
ingress_class_name: ''
ingress_hosts: []
ingress_tls_secret: ''
ingress_annotations: ''
front_end_url: ''
csrf_trusted_origins: []

service_type: ClusterIP
resource_requirements: {}

# Service registration + JWT trust bootstrap
run_register_job: true
# DNS name of Controller Service (may be empty until AWX is deployed)
controller_service: ''
# ClusterIP Service port (installer publishes port 80 → targetPort 8052)
controller_service_port: "80"
controller_service_https: false
# After register Job: generate_service_secret controller → K8s Secret
generate_controller_service_secret: true
register_image: mirror.gcr.io/library/python:3.12-slim

# Set by operator meta
deployment_type: awx
set_self_labels: true
