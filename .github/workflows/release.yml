name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Container image package (separate from Helm chart package)
  OPERATOR_IMAGE: ghcr.io/flippyboy/awx/awx-platform-operator
  # Helm OCI package name comes from Chart.yaml (awx-platform-operator-helm)
  HELM_OCI_REGISTRY: oci://ghcr.io/flippyboy/awx

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU / Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.OPERATOR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Package and push Helm chart (separate GHCR package)
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#v}
          # Chart package name is Chart.yaml "name" → awx-platform-operator-helm
          sed -i "s/^version:.*/version: ${VERSION}/" charts/awx-platform-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/awx-platform-operator/Chart.yaml
          # Ensure operator image default in chart matches this release
          sed -i "s|^  image:.*|  image: ${OPERATOR_IMAGE}|" charts/awx-platform-operator/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${VERSION}\"|" charts/awx-platform-operator/values.yaml

          helm package charts/awx-platform-operator -d dist
          # Push as its own OCI package: ghcr.io/flippyboy/awx/awx-platform-operator-helm
          helm push dist/awx-platform-operator-helm-*.tgz "${HELM_OCI_REGISTRY}"

      - name: Attach chart tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
