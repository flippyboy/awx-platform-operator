name: release

# Git tags:
#   v2026.10.26        first cut that UTC day
#   v2026.10.26-1      another cut the same day
#   v0.1.x             legacy semver, already published
#
# Image and chart versions drop the leading v: 2026.10.26

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Container image package (separate from Helm chart package)
  OPERATOR_IMAGE: ghcr.io/flippyboy/awx/awx-platform-operator
  # Helm OCI package name comes from Chart.yaml (awx-platform-operator-helm)
  HELM_OCI_REGISTRY: oci://ghcr.io/flippyboy/awx

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU / Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys
          sys.path.insert(0, "release")
          import calver
          ref = os.environ["GITHUB_REF_NAME"]
          version = ref[1:] if ref.startswith("v") else ref
          legacy = re.fullmatch(r"0\.\d+\.\d+", version)
          if not calver.is_calver(version) and not legacy:
              print(
                  f"::error::Tag {ref} must be calver vYYYY.MM.DD "
                  "or vYYYY.MM.DD-N (legacy v0.x.y tags still build)",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"version={version}")
          PY

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.OPERATOR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha

      - name: Build and push operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Package and push Helm chart (separate GHCR package)
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=${{ steps.ver.outputs.version }}
          # Chart package name is Chart.yaml "name" → awx-platform-operator-helm
          sed -i "s/^version:.*/version: ${VERSION}/" charts/awx-platform-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/awx-platform-operator/Chart.yaml
          # Ensure operator image default in chart matches this release
          sed -i "s|^  image:.*|  image: ${OPERATOR_IMAGE}|" charts/awx-platform-operator/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${VERSION}\"|" charts/awx-platform-operator/values.yaml

          helm package charts/awx-platform-operator -d dist
          # Push as its own OCI package: ghcr.io/flippyboy/awx/awx-platform-operator-helm
          helm push dist/awx-platform-operator-helm-*.tgz "${HELM_OCI_REGISTRY}"

      - name: Attach chart tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # v0.1.13 → release/notes/v0.1.13.md, v2026.10.26 → release/notes/v2026.10.26.md
          body_path: release/notes/v${{ steps.ver.outputs.version }}.md
          files: dist/*.tgz
          generate_release_notes: true
