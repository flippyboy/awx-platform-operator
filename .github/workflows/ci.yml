name: ci

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Lint chart
        run: helm lint charts/awx-platform-operator
      - name: Template chart (platform example)
        run: |
          helm template test charts/awx-platform-operator \
            -f charts/awx-platform-operator/examples/platform-kind.yaml \
            --namespace awx-platform >/dev/null
      - name: Template chart (gateway-only example)
        run: |
          helm template test charts/awx-platform-operator \
            -f charts/awx-platform-operator/examples/awx-gateway-only.yaml \
            --namespace awx-platform >/dev/null

  crds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure chart CRDs match config/crd/bases
        run: |
          set -euo pipefail
          ./hack/scripts/helm-sync-crds.sh
          if ! git diff --quiet charts/awx-platform-operator/crds; then
            echo "Chart CRDs are out of sync with config/crd/bases"
            git diff --stat charts/awx-platform-operator/crds
            exit 1
          fi
          echo "CRDs in sync"

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ansible + kubernetes.core
        run: |
          pip install "ansible-core>=2.16,<2.19"
          ansible-galaxy collection install kubernetes.core
      - name: Syntax-check operator playbooks
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible-kind.cfg
        run: |
          set -euo pipefail
          for p in playbooks/awx.yml playbooks/awxgateway.yml playbooks/awxplatform.yml; do
            echo ">> syntax-check $p"
            ansible-playbook --syntax-check -i localhost, "$p"
          done
