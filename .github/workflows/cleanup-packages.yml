name: cleanup-packages

# Delete obsolete GHCR packages from early releases (wrong path / mixed helm+image).
# Does NOT delete packages under awx/* (correct namespace).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, list targets only (no delete)"
        type: boolean
        default: true
      packages:
        description: "Comma-separated user package names to delete"
        type: string
        # Old operator image was ghcr.io/flippyboy/awx-platform-operator (not under awx/)
        default: "awx-platform-operator"

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete user packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGES: ${{ inputs.packages }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys, urllib.parse

          owner = os.environ["OWNER"]
          dry = os.environ.get("DRY_RUN", "true").lower() == "true"
          names = [n.strip() for n in os.environ.get("PACKAGES", "").split(",") if n.strip()]

          def gh(*args):
              r = subprocess.run(
                  ["gh", "api", *args],
                  capture_output=True,
                  text=True,
              )
              return r.returncode, r.stdout, r.stderr

          for name in names:
              if name.startswith("awx/"):
                  print(f"skip (protected namespace): {name}")
                  continue
              print(f"=== package: {owner}/{name} ===")
              enc = urllib.parse.quote(name, safe="")
              path = f"users/{owner}/packages/container/{enc}/versions"
              code, out, err = gh("--paginate", path)
              if code != 0:
                  print(f"list versions failed (maybe missing): {err.strip() or out.strip()}")
                  versions = []
              else:
                  try:
                      versions = json.loads(out) if out.strip() else []
                  except json.JSONDecodeError:
                      versions = []
              print(f"versions: {len(versions)}")
              for v in versions:
                  tags = (
                      (v.get("metadata") or {})
                      .get("container", {})
                      .get("tags")
                      or []
                  )
                  tag_s = ",".join(tags) if tags else "(untagged)"
                  print(f"  id={v.get('id')} tags={tag_s} updated={v.get('updated_at')}")
              pkg = f"users/{owner}/packages/container/{enc}"
              if dry:
                  print(f"(dry-run) would DELETE {pkg}")
                  continue
              print(f"Deleting {pkg}")
              code, out, err = gh("-X", "DELETE", pkg)
              if code == 0:
                  print(f"deleted {name}")
              else:
                  print(f"failed to delete {name}: {err.strip() or out.strip()}")
          PY
