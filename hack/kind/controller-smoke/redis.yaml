apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-awx
  namespace: awx-platform
  labels:
    app: redis-awx
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-awx
  template:
    metadata:
      labels:
        app: redis-awx
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: redis
          image: mirror.gcr.io/library/redis:7.4
          args:
            - redis-server
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "no"
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-awx
  namespace: awx-platform
  labels:
    app: redis-awx
spec:
  selector:
    app: redis-awx
  ports:
    - port: 6379
      targetPort: 6379
