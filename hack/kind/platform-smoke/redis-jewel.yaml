apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-jewel
  namespace: awx-platform
  labels:
    app: redis-jewel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-jewel
  template:
    metadata:
      labels:
        app: redis-jewel
    spec:
      containers:
        - name: redis
          image: mirror.gcr.io/library/redis:7.4
          args: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-jewel
  namespace: awx-platform
spec:
  selector:
    app: redis-jewel
  ports:
    - port: 6379
      targetPort: 6379
