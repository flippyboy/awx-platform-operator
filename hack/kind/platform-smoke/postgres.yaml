apiVersion: v1
kind: Secret
metadata:
  name: platform-pg
  namespace: awx-platform
type: Opaque
stringData:
  POSTGRES_USER: awx
  POSTGRES_PASSWORD: awx
  POSTGRES_DB: awx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: awx-platform
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:15
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-pg
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-pg
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: platform-pg
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "awx"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: awx-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# One-shot: ensure gateway database exists
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-gateway-db
  namespace: awx-platform
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mirror.gcr.io/library/postgres:15
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-pg
                  key: POSTGRES_PASSWORD
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              until pg_isready -h postgres -U awx; do sleep 2; done
              psql -h postgres -U awx -d awx -tc "SELECT 1 FROM pg_database WHERE datname='gateway'" | grep -q 1 \
                || psql -h postgres -U awx -d awx -c "CREATE DATABASE gateway"
              echo "gateway DB ready"
