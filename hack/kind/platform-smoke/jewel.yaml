apiVersion: v1
kind: Secret
metadata:
  name: jewel-secrets
  namespace: awx-platform
type: Opaque
stringData:
  SECRET_KEY: "kind-jewel-dev-secret-key-change-me-32b"
  # Minimal self-signed material is generated by init container if empty mounts fail;
  # for smoke we use a pre-generated inline cert via configmap below.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jewel-settings
  namespace: awx-platform
data:
  settings.py: |
    DEBUG = False
    ALLOWED_HOSTS = ['*']
    CSRF_COOKIE_SECURE = False
    SESSION_COOKIE_SECURE = False
    CSRF_TRUSTED_ORIGINS = [
        'https://localhost',
        'https://localhost:8443',
        'http://localhost:8080',
    ]
    FRONT_END_URL = 'https://localhost:8443'
    ENVOY_VERIFY_HTTPS_CERTIFICATES = False
    import os
    _redis_url = os.environ.get('REDIS_URL', 'redis://redis-jewel:6379/0')
    CACHES = {
        'default': {
            'BACKEND': 'ansible_base.lib.cache.redis_cache.DABRedisCache',
            'LOCATION': _redis_url + '?db=4',
            'KEY_PREFIX': 'gateway',
        },
        'legacy': {
            'BACKEND': 'ansible_base.lib.cache.fallback_cache.DABCacheWithFallback',
        },
        'primary': {
            'BACKEND': 'django_redis.cache.RedisCache',
            'LOCATION': _redis_url,
            'KEY_PREFIX': 'gateway',
            'OPTIONS': {
                'CLIENT_CLASS': 'ansible_base.lib.redis.RedisClient',
                'CLIENT_CLASS_KWARGS': {
                    'mode': 'standalone',
                    'redis_hosts': 'redis-jewel:6379',
                    'ssl': False,
                    'ssl_keyfile': None,
                    'ssl_certfile': None,
                    'ssl_cert_reqs': None,
                    'ssl_ca_certs': None,
                    'ssl_check_hostname': False,
                    'socket_keepalive': True,
                    'socket_timeout': 5,
                    'socket_connect_timeout': 5,
                    'cluster_error_retry_attempts': 0,
                },
            },
        },
        'fallback': {
            'BACKEND': 'django.core.cache.backends.filebased.FileBasedCache',
            'LOCATION': '/var/tmp/django_cache',
        },
    }
  container-startup.yml: |
    gateway_admin_username: admin
    gateway_admin_password: admin
    gateway_node_count: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewel
  namespace: awx-platform
  labels:
    app: jewel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jewel
  template:
    metadata:
      labels:
        app: jewel
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: gen-tls
          image: mirror.gcr.io/library/alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache openssl >/dev/null
              if [ ! -s /tls/tls.crt ]; then
                openssl req -nodes -newkey rsa:2048 -keyout /tls/tls.key -out /tmp/csr \
                  -subj "/CN=jewel" 2>/dev/null
                openssl x509 -req -days 3650 -in /tmp/csr -signkey /tls/tls.key -out /tls/tls.crt 2>/dev/null
                chmod 644 /tls/tls.crt /tls/tls.key
              fi
          volumeMounts:
            - name: tls
              mountPath: /tls
      containers:
        - name: jewel
          # Local jewel-with-UI (make build-jewel). Loaded into kind by kind-up.sh.
          # Override: JEWEL_IMAGE=... ./scripts/kind-up.sh (also set image via kubectl)
          image: awx-compose/jewel:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: aap_gateway_api.settings
            - name: DATABASE_NAME
              value: gateway
            - name: DATABASE_USER
              value: awx
            - name: DATABASE_PASSWORD
              value: awx
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: REDIS_URL
              value: redis://redis-jewel:6379/0
            - name: REDIS_TLS
              value: "false"
            - name: REDIS_MODE
              value: standalone
            - name: REDIS_HOSTS
              value: redis-jewel:6379
            - name: REDIS_SSL_CERT_REQS
              value: none
            - name: CACHE_KEY_PREFIX
              value: gateway
            - name: ENVOY_HOSTNAME
              value: envoy
            - name: ENVOY_VERIFY_HTTPS_CERTIFICATES
              value: "false"
            - name: CONTAINER_NUMBER
              value: "1"
          ports:
            - name: https
              containerPort: 8000
            - name: grpc
              containerPort: 50051
          volumeMounts:
            - name: secret-key
              mountPath: /etc/ansible-automation-platform/gateway/SECRET_KEY
              subPath: SECRET_KEY
            - name: tls
              mountPath: /etc/ansible-automation-platform/gateway/gateway.crt
              subPath: tls.crt
            - name: tls
              mountPath: /etc/ansible-automation-platform/gateway/gateway.key
              subPath: tls.key
            - name: settings
              mountPath: /etc/ansible-automation-platform/gateway/settings.py
              subPath: settings.py
            - name: settings
              mountPath: /opt/aap_gateway/src/container-startup.yml
              subPath: container-startup.yml
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
      volumes:
        - name: secret-key
          secret:
            secretName: jewel-secrets
            items:
              - key: SECRET_KEY
                path: SECRET_KEY
        - name: tls
          emptyDir: {}
        - name: settings
          configMap:
            name: jewel-settings
---
apiVersion: v1
kind: Service
metadata:
  name: jewel
  namespace: awx-platform
spec:
  selector:
    app: jewel
  ports:
    - name: https
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 50051
      targetPort: 50051
