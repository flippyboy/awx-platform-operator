{{- if $.Values.AWX.enabled }}
{{- with .Values.AWX }}
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  {{- with .labels }}
  labels:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  {{- with .annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
spec:
{{- /* Provide custom persistent volumes configs if enabled */}}
{{- include "spec.storageClassNames" $ }}
{{- /* Provide custom secrets configs if enabled */}}
{{- include "spec.secrets" $ }}
{{- /* Include raw map from the values file spec */}}
{{ .spec | toYaml | indent 2 }}
{{- /* Provide security context defaults */}}
  {{- if not (hasKey .spec "security_context_settings") }}
  security_context_settings:
    runAsGroup: 0
    runAsUser: 0
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch
  {{- end }}
{{- /* Postgres: prefer shared externalPostgres, then AWX.postgres block */}}
  {{- if not (hasKey .spec "postgres_configuration_secret") }}
  {{- if $.Values.externalPostgres.enabled }}
  postgres_configuration_secret: {{ include "platform.postgresSecretName" $ }}
  {{- else if .postgres.enabled }}
  postgres_configuration_secret: {{ include "postgres.secretName" $ }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
