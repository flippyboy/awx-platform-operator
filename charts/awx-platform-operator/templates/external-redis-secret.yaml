{{- if .Values.externalRedis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.redisSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  {{- if .Values.externalRedis.url }}
  url: {{ .Values.externalRedis.url | quote }}
  {{- else }}
  host: {{ .Values.externalRedis.host | required "externalRedis.host or externalRedis.url is required" | quote }}
  port: {{ .Values.externalRedis.port | default "6379" | quote }}
  url: {{ printf "redis://%s:%s/0" .Values.externalRedis.host (.Values.externalRedis.port | default "6379" | toString) | quote }}
  {{- end }}
{{- end }}
