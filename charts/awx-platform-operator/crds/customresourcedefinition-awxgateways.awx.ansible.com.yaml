---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awxgateways.awx.ansible.com
  annotations:
    controller-gen.kubebuilder.io/version: placeholder
spec:
  group: awx.ansible.com
  names:
    kind: AWXGateway
    listKind: AWXGatewayList
    plural: awxgateways
    singular: awxgateway
    shortNames:
      - awxgw
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: AWXGateway deploys Jewel (platform gateway) and optional Envoy edge
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                image:
                  description: Jewel container image repository
                  type: string
                  default: ghcr.io/ansible/jewel
                image_version:
                  description: Jewel image tag
                  type: string
                  default: latest
                image_pull_policy:
                  type: string
                  default: IfNotPresent
                image_pull_secrets:
                  type: array
                  items:
                    type: string
                replicas:
                  type: integer
                  default: 1
                admin_user:
                  type: string
                  default: admin
                admin_password_secret:
                  type: string
                secret_key_secret:
                  type: string
                postgres_configuration_secret:
                  description: Secret with host/port/database/username/password for gateway DB
                  type: string
                database_name:
                  type: string
                  default: gateway
                redis_image:
                  type: string
                  default: docker.io/redis
                redis_image_version:
                  type: string
                  default: "7"
                redis_url:
                  description: External Redis URL (redis://host:6379/0). Skips managed Redis.
                  type: string
                redis_configuration_secret:
                  description: Secret with url or host+port for external Redis
                  type: string
                redis_managed:
                  description: Deploy managed Redis when true and no external Redis set
                  type: boolean
                  default: true
                tls_secret:
                  description: >-
                    kubernetes.tls Secret (tls.crt/tls.key) mounted into BOTH Jewel and
                    Envoy. When create_certificate is true, defaults to {name}-tls
                    and is issued by cert-manager.
                  type: string
                create_certificate:
                  description: >-
                    When true (default), create a cert-manager Certificate for
                    shared Jewel+Envoy TLS. Requires cert-manager. Set false to
                    use an existing tls_secret or legacy init-generated certs.
                  type: boolean
                  default: true
                create_tls_issuer:
                  description: >-
                    When true (default) and create_certificate is true, create a
                    namespaced self-signed Issuer ({name}-selfsigned).
                  type: boolean
                  default: true
                tls_issuer:
                  description: Issuer/ClusterIssuer name (default {name}-selfsigned)
                  type: string
                tls_issuer_kind:
                  description: Issuer or ClusterIssuer
                  type: string
                  default: Issuer
                  enum: [Issuer, ClusterIssuer]
                tls_issuer_group:
                  type: string
                  default: cert-manager.io
                tls_dns_names:
                  description: DNS SANs for the Certificate (defaults include service FQDNs)
                  type: array
                  items:
                    type: string
                tls_duration:
                  type: string
                  default: 2160h
                tls_renew_before:
                  type: string
                  default: 360h
                create_tls_ca_configmap:
                  description: Publish CA ConfigMap for Gateway API BackendTLSPolicy
                  type: boolean
                  default: true
                tls_ca_configmap:
                  description: Name of CA ConfigMap (default {name}-tls-ca)
                  type: string
                ui_mode:
                  description: baked | init_copy | none
                  type: string
                  default: baked
                  enum: [baked, init_copy, none]
                ui_image:
                  description: Platform UI image when ui_mode=init_copy
                  type: string
                envoy_enabled:
                  description: Deploy Envoy proxy configured for this gateway
                  type: boolean
                  default: true
                envoy_image:
                  type: string
                  default: mirror.gcr.io/envoyproxy/envoy
                envoy_image_version:
                  type: string
                  default: v1.36.6
                # Phase 3 edge (targets Envoy)
                ingress_type:
                  type: string
                  default: none
                  enum: [none, ingress, route]
                ingress_class_name:
                  type: string
                ingress_hosts:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                ingress_tls_secret:
                  type: string
                ingress_annotations:
                  type: string
                front_end_url:
                  type: string
                service_type:
                  type: string
                  default: ClusterIP
                resource_requirements:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                URL:
                  type: string
                controllerServiceSecret:
                  description: Name of Secret (key secret) for Controller RESOURCE_SERVER
                  type: string
                tlsSecret:
                  description: Secret used for Jewel+Envoy TLS
                  type: string
                tlsMode:
                  description: secret | init-generated
                  type: string
                tlsCAConfigMap:
                  description: ConfigMap with ca.crt for BackendTLSPolicy
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .status.URL
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
