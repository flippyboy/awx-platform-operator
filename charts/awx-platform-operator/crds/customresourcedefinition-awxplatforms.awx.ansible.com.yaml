---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awxplatforms.awx.ansible.com
spec:
  group: awx.ansible.com
  names:
    kind: AWXPlatform
    listKind: AWXPlatformList
    plural: awxplatforms
    singular: awxplatform
    shortNames:
      - awxplat
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: >-
            AWXPlatform orchestrates Controller (AWX), Jewel gateway, Envoy edge,
            and JWT/service registration bootstrap (compose-equivalent).
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                admin_user:
                  type: string
                  default: admin
                admin_password_secret:
                  type: string
                open_source_defaults:
                  type: boolean
                  default: true
                controller:
                  type: object
                  properties:
                    create:
                      type: boolean
                      default: true
                    name:
                      description: Name of AWX CR (default {platform}-controller)
                      type: string
                    image:
                      type: string
                    image_version:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                gateway:
                  type: object
                  properties:
                    create:
                      type: boolean
                      default: true
                    name:
                      type: string
                    image:
                      type: string
                    image_version:
                      type: string
                    ui_mode:
                      type: string
                      default: baked
                    ui_image:
                      type: string
                    tls_secret:
                      type: string
                    create_certificate:
                      type: boolean
                      default: true
                    create_tls_issuer:
                      type: boolean
                      default: true
                    tls_issuer:
                      type: string
                    tls_issuer_kind:
                      type: string
                      default: Issuer
                    tls_dns_names:
                      type: array
                      items:
                        type: string
                    controller_service_port:
                      description: Controller Service port passed through to AWXGateway
                      type: string
                      default: "80"
                    controller_service_https:
                      type: boolean
                      default: false
                    envoy_enabled:
                      type: boolean
                      default: true
                  x-kubernetes-preserve-unknown-fields: true
                ingress:
                  type: object
                  properties:
                    type:
                      type: string
                      default: none
                      enum: [none, ingress, route]
                    ingress_class_name:
                      type: string
                    hosts:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    tls_secret:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                bootstrap:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                  x-kubernetes-preserve-unknown-fields: true
                postgres_configuration_secret:
                  description: >-
                    Shared external Postgres secret (host/port/database/username/password;
                    type=unmanaged recommended). Required when creating children.
                  type: string
                redis_configuration_secret:
                  description: >-
                    Optional external Redis for gateway (keys url, or host+port).
                    When set, gateway does not deploy managed Redis.
                  type: string
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                URL:
                  type: string
                controllerName:
                  type: string
                gatewayName:
                  type: string
                trustEstablished:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .status.URL
        - name: Trust
          type: boolean
          jsonPath: .status.trustEstablished
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
