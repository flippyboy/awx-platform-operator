# Deploy operator + Jewel gateway only (Controller separate or later)
operator:
  image: ghcr.io/flippyboy/awx/awx-platform-operator
  tag: "0.1.8"

externalPostgres:
  enabled: true
  host: postgres
  port: 5432
  dbName: awx
  username: awx
  password: awx
  type: unmanaged

AWXGateway:
  enabled: true
  name: demo-gateway
  spec:
    image: ghcr.io/flippyboy/awx/jewel-with-ui
    image_version: "0.1.0"
    ui_mode: baked
    envoy_enabled: true
    replicas: 1
    ingress_type: none
    # Requires cert-manager in the cluster
    create_certificate: true
    create_tls_issuer: true

AWX:
  enabled: false
AWXPlatform:
  enabled: false
