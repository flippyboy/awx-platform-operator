keywords:
  - awx
  - ansible
  - operator
  - jewel
  - platform-gateway
sources:
  - https://github.com/ansible-community/awx-operator-helm
  - https://github.com/ansible/awx-operator
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: Gateway Envoy, Jewel, Redis, and Jobs run as non-root with a restricted Pod Security context
    - kind: changed
      description: Default jewel-with-ui and platform-ui images are 0.1.2
