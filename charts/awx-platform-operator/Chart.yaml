---
apiVersion: v2
name: awx-platform-operator-helm
description: >-
  Fork of ansible-community/awx-operator-helm for the AWX platform operator
  (Controller + Jewel gateway + Envoy + AWXPlatform/AWXGateway CRs).
type: application
# Chart version for this monorepo fork
version: 0.1.12
# Operator image tag / app version (local build or published fork)
appVersion: "0.1.12"
home: https://github.com/ansible/awx-operator
keywords:
  - awx
  - ansible
  - operator
  - jewel
  - platform-gateway
sources:
  - https://github.com/ansible-community/awx-operator-helm
  - https://github.com/ansible/awx-operator
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: Gateway database, admin, and Redis credentials are referenced from Secrets
    - kind: security
      description: Envoy no longer runs as root and its admin port is not a Service
    - kind: changed
      description: Dependabot updates the operator image, GitHub Actions, and Python dependencies
