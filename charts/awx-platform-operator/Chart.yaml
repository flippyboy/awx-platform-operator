---
apiVersion: v2
name: awx-platform-operator-helm
description: >-
  Fork of ansible-community/awx-operator-helm for the AWX platform operator
  (Controller + Jewel gateway + Envoy + AWXPlatform/AWXGateway CRs).
type: application
# Chart version for this monorepo fork
version: 0.1.13
# Operator image tag / app version (local build or published fork)
appVersion: "0.1.13"
home: https://github.com/ansible/awx-operator
keywords:
  - awx
  - ansible
  - operator
  - jewel
  - platform-gateway
sources:
  - https://github.com/ansible-community/awx-operator-helm
  - https://github.com/ansible/awx-operator
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: Controller web, task, migration, and the operator manager satisfy the restricted Pod Security profile
    - kind: changed
      description: AWXPlatform keeps the Helm managed-by label, and the classic AWX chart no longer injects runAsUser 0
