# Component image pins consumed by this operator release.
# platform-ui and jewel-with-ui are chosen in awx-platform-images and applied
# by images-released. The upstream controller pin is chosen here by
# release/awx_pin.py: devel commit, and the digest of the floating devel tag.
# Each image has an independent release train — bump only what changed.
#
# Images repo git tags: platform-ui-vYYYY.MM.DD, jewel-with-ui-vYYYY.MM.DD
# (same-day recut: platform-ui-vYYYY.MM.DD-N). GHCR image tags omit the v.
# Tags already published as 0.1.x stay as they are until that component is cut again.
#
# This operator's git tags are vYYYY.MM.DD from the next cut onward.
# The operator pin below stays 0.1.13 until that cut.
#
# schema_version: 1

